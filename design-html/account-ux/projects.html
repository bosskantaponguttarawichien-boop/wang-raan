<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>วางร้าน — ผังของฉัน (Mockup)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<style>
:root{
  --blue:#3b62f4;--blue-h:#2e50da;--blue-soft:#edf1ff;
  --ink:#1e2b40;--sec:#66758a;--mut:#8492a5;--line:#e2e8f1;--surf:#f7f9fc;--white:#fff;
  --danger:#e4685d;--danger-soft:#fdeeec;--danger-ink:#b23d33;
  --ok-soft:#e7f5f0;--ok-ink:#1f6e55;--warn-soft:#fdf6e7;--warn-ink:#8a6414;
  --focus:#a4b6ff;
  --font:"Noto Sans Thai",system-ui,-apple-system,Tahoma,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--font);color:var(--ink);background:var(--surf);font-size:14px;min-height:100vh}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.mocknav{display:flex;align-items:center;gap:6px;padding:6px 12px;background:var(--ink);color:#c9d3e3;font-size:12px;overflow-x:auto;white-space:nowrap}
.mocknav b{color:#fff;font-weight:500;margin-right:6px}
.mocknav button{background:transparent;border:1px solid #3a4a63;color:#dfe6f1;border-radius:999px;padding:3px 10px;cursor:pointer;font-size:12px}
.mocknav button.on{background:#fff;color:var(--ink);border-color:#fff}

.hd{display:flex;align-items:center;gap:10px;height:56px;padding:0 clamp(16px,4vw,40px);background:var(--white);border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:8px;font-weight:600;font-size:18px;text-decoration:none;color:var(--ink);flex:none}
.logo img{width:30px;height:30px}
.sp{flex:1}
.menu-wrap{position:relative}
.acct{display:flex;align-items:center;gap:8px;border:0;background:transparent;border-radius:999px;padding:4px 8px 4px 4px;cursor:pointer;max-width:240px}
.acct:hover{background:var(--surf)}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--blue-soft);color:var(--blue);display:grid;place-items:center;font-weight:600;flex:none}
.acct span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--sec)}
.menu{position:absolute;right:0;top:calc(100% + 6px);background:#fff;border:1px solid var(--line);border-radius:12px;padding:6px;min-width:220px;box-shadow:0 10px 30px rgba(30,43,64,.12);z-index:40}
.menu .who{padding:8px 10px;border-bottom:1px solid var(--line);margin-bottom:4px}
.menu .who small{display:block;color:var(--mut);font-size:12px;word-break:break-all}
.menu button{display:flex;width:100%;align-items:center;gap:10px;border:0;background:transparent;padding:8px 10px;border-radius:8px;cursor:pointer;text-align:left}
.menu button:hover{background:var(--surf)}

main{max-width:1120px;margin:0 auto;padding:clamp(20px,4vw,40px) clamp(16px,4vw,40px) 60px}
.title-row{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:20px}
h1{font-size:24px;font-weight:600;margin:0}
.count{color:var(--sec);margin:4px 0 0}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:40px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--white);cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:#c8d2e2}
.btn.pri{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.pri:hover{background:var(--blue-h)}
.btn.danger{background:var(--danger-ink);border-color:var(--danger-ink);color:#fff}
.btn[aria-disabled=true]{opacity:.6;cursor:not-allowed}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,264px),1fr));gap:20px;list-style:none;margin:0;padding:0}
.card{position:relative;background:var(--white);border:1px solid var(--line);border-radius:16px;overflow:hidden;transition:border-color .15s,box-shadow .15s,transform .15s}
.card:hover{border-color:#c8d2e2;box-shadow:0 10px 28px rgba(30,43,64,.08)}
.card a.open{display:block;text-decoration:none;color:inherit}
.card a.open::after{content:"";position:absolute;inset:0;border-radius:16px}
.card a.open:focus-visible{outline:none}
.card:has(a.open:focus-visible){outline:3px solid var(--focus);outline-offset:2px}
.thumb{aspect-ratio:16/10;background:#eef2f7;border-bottom:1px solid var(--line);display:grid;place-items:center;padding:14px;overflow:hidden}
.thumb svg{width:100%;height:100%;display:block;filter:drop-shadow(0 2px 6px rgba(30,43,64,.10))}
.info{display:flex;align-items:center;gap:12px;padding:14px 16px}
.info .badge{width:32px;height:32px;border-radius:8px;background:var(--blue);color:#fff;display:grid;place-items:center;font-size:18px;flex:none}
.info .txt{min-width:0}
.card h2{font-size:15px;font-weight:600;margin:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meta{color:var(--sec);font-size:13px;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.more{position:absolute;top:10px;right:10px;z-index:2;width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.95);color:var(--ink);display:grid;place-items:center;cursor:pointer;font-size:18px;opacity:0;transition:opacity .15s;box-shadow:0 2px 8px rgba(30,43,64,.08)}
.card:hover .more,.card:focus-within .more,.more[aria-expanded=true]{opacity:1}
@media (hover:none){.more{opacity:1}}
.more:hover{background:#fff;border-color:#c8d2e2}
.card .menu{top:48px;right:10px;min-width:180px;z-index:3}
.menu button.danger{color:var(--danger-ink)}
.menu button.danger:hover{background:var(--danger-soft)}

.new-card{border:1.5px dashed #c8d2e2;background:transparent;border-radius:16px;height:100%;min-height:200px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--blue);font-weight:500;cursor:pointer;width:100%}
.new-card:hover{border-color:var(--blue);background:var(--blue-soft)}
.new-card .plus{width:48px;height:48px;border-radius:12px;background:var(--blue-soft);display:grid;place-items:center;font-size:26px}
.new-card[aria-disabled=true]{color:var(--mut);cursor:not-allowed}
.new-card[aria-disabled=true]:hover{background:transparent;border-color:#c8d2e2}
.new-card[aria-disabled=true] .plus{background:var(--surf)}

.empty{background:var(--white);border:1px solid var(--line);border-radius:16px;padding:clamp(28px,6vw,56px) 20px;text-align:center}
.empty .ic{background:var(--blue-soft);color:var(--blue);display:grid;place-items:center;margin:0 auto 14px;width:64px;height:64px;font-size:32px;border-radius:16px}
.empty h2{font-size:18px;font-weight:600;margin:0 0 6px}
.empty p{color:var(--sec);margin:0 0 20px;line-height:1.6}

.sk{background:var(--white);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.sk .sk-t{aspect-ratio:16/10;border-radius:0}
.sk .sk-i{display:flex;gap:12px;align-items:center;padding:14px 16px}
.sk div{background:linear-gradient(90deg,#eef2f7 25%,#f6f8fb 50%,#eef2f7 75%);background-size:200% 100%;animation:sh 1.2s infinite;border-radius:8px}
@keyframes sh{to{background-position:-200% 0}}

.alert{display:flex;gap:10px;align-items:flex-start;border-radius:12px;padding:12px 14px;margin-bottom:16px;line-height:1.6}
.alert i{font-size:20px;flex:none}
.alert.err{background:var(--danger-soft);color:var(--danger-ink)}
.alert.warn{background:var(--warn-soft);color:var(--warn-ink)}
.alert .btn{height:32px;margin-left:auto}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:12px;padding:10px 14px;display:flex;gap:12px;align-items:center;box-shadow:0 10px 30px rgba(30,43,64,.2);max-width:calc(100vw - 32px);z-index:60}

.overlay{position:fixed;inset:0;grid-template-columns:minmax(0,1fr);background:rgba(30,43,64,.4);backdrop-filter:blur(2px);display:grid;place-items:center;padding:16px;z-index:50}
.dialog{background:#fff;border-radius:16px;padding:24px;width:min(420px,100%);box-shadow:0 20px 50px rgba(30,43,64,.2)}
.dialog h2{font-size:17px;font-weight:600;margin:0 0 8px}
.dialog p{color:var(--sec);margin:0 0 20px;line-height:1.6}
.dialog .field{display:flex;flex-direction:column;gap:6px;margin-bottom:6px}
.dialog .field label{font-size:13px;color:var(--sec);font-weight:500}
.dialog .field input{height:44px;border:1px solid var(--line);border-radius:10px;padding:0 12px;width:100%}
.dialog .field input:focus{border-color:var(--blue)}
.dialog .field input[aria-invalid=true]{border-color:var(--danger)}
.dialog .help{font-size:12px;color:var(--mut);margin:0 0 18px;display:flex;justify-content:space-between;gap:8px}
.dialog .help.err{color:var(--danger-ink)}
.dialog.wide{width:min(460px,100%)}
.dialog .desc{margin:-4px 0 18px;font-size:13px}
.dialog fieldset{border:0;padding:0;margin:0 0 16px;min-width:0}
.dialog legend{font-size:13px;color:var(--sec);font-weight:500;padding:0;margin-bottom:6px}
.dialog legend span{color:var(--mut);font-weight:400}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.size-row{display:flex;align-items:center;gap:8px}
.unit{flex:1;min-width:0;display:flex;align-items:center;gap:6px;height:44px;border:1px solid var(--line);border-radius:10px;padding:0 12px;color:var(--sec);font-size:13px}
.unit:focus-within{border-color:var(--blue);outline:3px solid var(--focus);outline-offset:1px}
.unit input{flex:1;min-width:0;border:0;outline:0;height:100%;font-size:15px;font-weight:500;color:var(--ink);text-align:right;padding:0;background:transparent}
.unit.bad{border-color:var(--danger)}
.x{color:var(--mut)}
.size .help{margin:6px 0 0}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{flex:1;border:0;background:#fff;height:40px;cursor:pointer}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-checked=true]{background:var(--blue-soft);color:#183cbd;font-weight:600}
.acts.split{justify-content:space-between;align-items:center;border-top:1px solid var(--line);padding-top:16px;margin-top:4px}
@media (max-width:480px){.acts.split{flex-direction:column-reverse;align-items:stretch}.acts.split .btn{width:100%}.acts.split>.acts{display:grid;grid-template-columns:1fr 1fr}}
.dialog .acts{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
[hidden]{display:none!important}

@media (max-width:480px){
  .acct span:not(.avatar){display:none}
  .title-row .btn.pri{width:100%}
}
</style>
</head>
<body>

<nav class="mocknav" aria-label="สถานะของ mockup">
  <b>Mockup /projects</b>
  <button data-go="list" class="on">มีผัง</button>
  <button data-go="empty">ยังไม่มีผัง</button>
  <button data-go="loading">กำลังโหลด</button>
  <button data-go="error">โหลดไม่ได้</button>
  <button data-go="limit">เต็มโควตา</button>
  <button onclick="location.href='login.html'">← /login</button>
</nav>

<header class="hd">
  <a class="logo" href="#"><img src="../assets/logos/logo-wangraan-minimal-flat.svg" alt="">วางร้าน</a>
  <div class="sp"></div>
  <div class="menu-wrap">
    <button class="acct" id="acct" aria-haspopup="menu" aria-expanded="false" aria-label="เมนูบัญชี">
      <span class="avatar" aria-hidden="true">ส</span><span>somchai@example.com</span><i class="ti ti-chevron-down" aria-hidden="true"></i>
    </button>
    <div class="menu" id="acct-menu" role="menu" hidden>
      <div class="who"><b>สมชาย</b><small>somchai@example.com · Google</small></div>
      <button role="menuitem"><i class="ti ti-user" aria-hidden="true"></i>บัญชีและข้อมูลส่วนตัว</button>
      <button role="menuitem" onclick="location.href='login.html'"><i class="ti ti-logout" aria-hidden="true"></i>ออกจากระบบ</button>
    </div>
  </div>
</header>

<main>
  <div class="title-row">
    <div>
      <h1>ผังของฉัน</h1>
      <p class="count" id="count"></p>
    </div>
    <button class="btn pri" id="new-top"><i class="ti ti-plus" aria-hidden="true"></i>สร้างผังใหม่</button>
  </div>

  <div id="alert"></div>
  <div id="content" aria-live="polite"></div>
</main>

<div class="overlay" id="namer" hidden>
  <form class="dialog wide" role="dialog" aria-modal="true" aria-labelledby="nm-t" aria-describedby="nm-d" id="nm-form" novalidate>
    <h2 id="nm-t">สร้างผังใหม่</h2>
    <p id="nm-d" class="desc">ใส่ค่าประมาณได้ แก้ทีหลังได้เสมอที่แท็บ “ร้าน”</p>
    <div class="field">
      <label for="nm-input">ชื่อผัง</label>
      <input id="nm-input" maxlength="80" autocomplete="off" aria-describedby="nm-help">
    </div>
    <p class="help" id="nm-help"><span id="nm-msg">เช่น ชื่อร้านหรือสาขา</span><span id="nm-count"></span></p>
    <fieldset class="size">
      <legend>ขนาดร้าน <span>(2–30 ม.)</span></legend>
      <div class="size-row">
        <div class="unit"><label for="nm-w" class="sr">ความกว้าง (เมตร)</label><span aria-hidden="true">กว้าง</span><input id="nm-w" type="number" inputmode="decimal" min="2" max="30" step="0.25" value="8"><span aria-hidden="true">ม.</span></div>
        <span class="x" aria-hidden="true">×</span>
        <div class="unit"><label for="nm-dp" class="sr">ความลึก (เมตร)</label><span aria-hidden="true">ลึก</span><input id="nm-dp" type="number" inputmode="decimal" min="2" max="30" step="0.25" value="6"><span aria-hidden="true">ม.</span></div>
      </div>
      <p class="help err" id="size-err" hidden></p>
    </fieldset>
    <fieldset class="door">
      <legend>ประตูอยู่ด้าน</legend>
      <div class="seg" role="radiogroup" aria-label="เลือกผนังทางเข้า">
        <button type="button" role="radio" aria-checked="false" data-wall="top">บน</button>
        <button type="button" role="radio" aria-checked="true" data-wall="bottom">ล่าง</button>
        <button type="button" role="radio" aria-checked="false" data-wall="left">ซ้าย</button>
        <button type="button" role="radio" aria-checked="false" data-wall="right">ขวา</button>
      </div>
    </fieldset>
    <div class="acts split">
      <button class="btn" type="button" id="nm-tpl"><i class="ti ti-layout-board" aria-hidden="true" style="color:var(--blue)"></i>ใช้ผังตัวอย่างแทน</button>
      <div class="acts">
        <button class="btn" type="button" id="nm-cancel">ยกเลิก</button>
        <button class="btn pri" type="submit">สร้างผัง<i class="ti ti-arrow-right" aria-hidden="true"></i></button>
      </div>
    </div>
  </form>
</div>

<div class="overlay" id="confirm" hidden>
  <div class="dialog" role="alertdialog" aria-modal="true" aria-labelledby="cf-t" aria-describedby="cf-d">
    <h2 id="cf-t">ลบผัง “<span id="cf-name"></span>”?</h2>
    <p id="cf-d">ผังนี้และลิงก์แชร์ทั้งหมดของผังจะถูกลบถาวร กู้คืนไม่ได้</p>
    <div class="acts">
      <button class="btn" id="cf-cancel">ยกเลิก</button>
      <button class="btn danger" id="cf-ok"><i class="ti ti-trash" aria-hidden="true"></i>ลบผัง</button>
    </div>
  </div>
</div>

<div class="toast" id="toast" role="status" hidden></div>

<script>
const $=s=>document.querySelector(s);
const LIMIT=20;
// ผังตัวอย่าง: หน่วยเมตร, x/y = มุมซ้ายบน · t4/t2 = ชุดโต๊ะ 4/2 ที่นั่ง (เก้าอี้วาดอัตโนมัติ)
const SAMPLES=[
  {id:'a1',name:'ร้านกาแฟสาขาสยาม',w:8,h:6,edited:'แก้ไขเมื่อ 5 นาทีที่แล้ว',door:{side:'bottom',at:3.5},objs:[
    {t:'kitchen',x:.25,y:.25,w:2.5,h:1.5},{t:'counter',x:3.5,y:.75,w:2.5,h:.75},
    {t:'t4',x:1,y:3},{t:'t4',x:3.25,y:3},{t:'t2',x:6.25,y:2.5},{t:'t2',x:6.25,y:4.25},{t:'t2',x:1,y:5}]},
  {id:'a2',name:'ครัวข้าวมันไก่ ตลาดน้อย',w:12,h:7.5,edited:'แก้ไขเมื่อวาน 18:40',door:{side:'left',at:5.5},objs:[
    {t:'kitchen',x:8.75,y:.25,w:3,h:2.5},{t:'counter',x:8.75,y:3.5,w:.75,h:2.5},
    {t:'t4',x:1.25,y:1},{t:'t4',x:3.75,y:1},{t:'t4',x:6.25,y:1},
    {t:'t4',x:1.25,y:3.5},{t:'t4',x:3.75,y:3.5},{t:'t4',x:6.25,y:3.5},
    {t:'t2',x:3.75,y:6},{t:'t2',x:6.25,y:6}]},
  {id:'a3',name:'ผังทดลอง — จัดโต๊ะแบบยาวริมหน้าต่าง',w:10,h:5,edited:'แก้ไขเมื่อ 12 ต.ค. 2569',door:{side:'right',at:2},objs:[
    {t:'t2',x:.75,y:.5},{t:'t2',x:2.5,y:.5},{t:'t2',x:4.25,y:.5},{t:'t2',x:6,y:.5},
    {t:'kitchen',x:.25,y:3.25,w:3,h:1.5},{t:'counter',x:4.25,y:3.75,w:3,h:.75},{t:'t4',x:8,y:3.5}]},
  {id:'a4',name:'บาร์ชั้นสอง',w:6.5,h:9,edited:'แก้ไขเมื่อ 2 ต.ค. 2569',door:{side:'bottom',at:5},objs:[
    {t:'kitchen',x:.25,y:.25,w:2.25,h:1.75},{t:'counter',x:.25,y:2.5,w:.75,h:4.5},
    {t:'t2',x:2.5,y:1},{t:'t2',x:4.75,y:1},{t:'t4',x:2.75,y:3.5},{t:'t4',x:2.75,y:6},{t:'t2',x:4.75,y:4.75}]},
];
let data=SAMPLES.slice();

// สีตาม PLAN_COLORS ใน src/core/export/plan-svg.ts — ของจริงให้ใช้ renderPlanSvg (grid:false) แทนโค้ดนี้
const PC={wall:'#b6c4d7',door:'#3b62f4',kitchen:['#e8edf5','#9bb0c9','#c4d3e5'],counter:['#e1e8f3','#aebed3'],table:['#edf1ff','#8da6ef'],chair:['#f8f0e5','#d9ad7d']};
const TS={t4:1,t2:.75},CH=.42,TUCK=.1;
function planSvg(p){
  const M=.45,S=40,r=v=>+(v*S).toFixed(1),o=[];
  const rect=(x,y,w,h,[f,st],rx=.06,sw=1.4)=>o.push(`<rect x="${r(x)}" y="${r(y)}" width="${r(w)}" height="${r(h)}" rx="${r(rx)}" fill="${f}" stroke="${st}" stroke-width="${sw}"/>`);
  o.push(`<rect x="0" y="0" width="${r(p.w)}" height="${r(p.h)}" fill="#fff" stroke="${PC.wall}" stroke-width="5"/>`);
  for(const b of p.objs){
    if(b.t==='kitchen'){rect(b.x,b.y,b.w,b.h,PC.kitchen);const cx=b.x+b.w/2,cy=b.y+b.h/2;[-.45,.45].forEach(d=>o.push(`<circle cx="${r(cx+d)}" cy="${r(cy)}" r="${r(.22)}" fill="none" stroke="${PC.kitchen[2]}" stroke-width="2"/>`));continue}
    if(b.t==='counter'){rect(b.x,b.y,b.w,b.h,PC.counter);continue}
    const s=TS[b.t],cx=b.x+s/2,cy=b.y+s/2,d=s/2+CH/2-TUCK,cs=b.t==='t4'?[[0,-d],[0,d],[-d,0],[d,0]]:[[-d,0],[d,0]];
    cs.forEach(([dx,dy])=>rect(cx+dx-CH/2,cy+dy-CH/2,CH,CH,PC.chair,.1,1.2));
    rect(b.x,b.y,s,s,PC.table,.12,1.6);
  }
  const {side,at}=p.door,L=1,dw=[];
  if(side==='bottom')dw.push(at,p.h,at+L,p.h);else if(side==='top')dw.push(at,0,at+L,0);
  else if(side==='left')dw.push(0,at,0,at+L);else dw.push(p.w,at,p.w,at+L);
  o.push(`<line x1="${r(dw[0])}" y1="${r(dw[1])}" x2="${r(dw[2])}" y2="${r(dw[3])}" stroke="#fff" stroke-width="7"/><line x1="${r(dw[0])}" y1="${r(dw[1])}" x2="${r(dw[2])}" y2="${r(dw[3])}" stroke="${PC.door}" stroke-width="5" stroke-linecap="round"/>`);
  return `<svg viewBox="${r(-M)} ${r(-M)} ${r(p.w+2*M)} ${r(p.h+2*M)}" preserveAspectRatio="xMidYMid meet" aria-hidden="true" focusable="false">${o.join('')}</svg>`;
}
let state='list',pending=null;
const fmt=n=>Number.isInteger(n)?n:n.toFixed(2).replace(/0$/,'');

function render(){
  const c=$('#content'),a=$('#alert');a.innerHTML='';
  $('#count').textContent=state==='list'||state==='limit'?`${data.length} ผัง`:'';
  $('#new-top').hidden=state==='empty'||state==='loading'||state==='error';
  if(state==='loading'){
    c.innerHTML=`<ul class="grid" aria-busy="true" aria-label="กำลังโหลดผัง">${'<li class="sk"><div class="sk-t"></div><div class="sk-i"><div style="width:32px;height:32px;flex:none"></div><div style="flex:1"><div style="height:14px;width:70%;margin-bottom:8px"></div><div style="height:12px;width:45%"></div></div></div></li>'.repeat(3)}</ul>`;return;
  }
  if(state==='error'){
    c.innerHTML='';a.innerHTML=`<div class="alert err" role="alert"><i class="ti ti-cloud-off" aria-hidden="true"></i><div><b>โหลดรายการผังไม่ได้</b><br>ระบบจัดเก็บขัดข้องชั่วคราว ผังของคุณไม่หาย ลองใหม่อีกครั้ง</div><button class="btn" onclick="go('list')">ลองใหม่</button></div>`;return;
  }
  if(state==='empty'||data.length===0){
    c.innerHTML=`<div class="empty"><div class="ic"><i class="ti ti-layout-dashboard" aria-hidden="true"></i></div><h2>ยังไม่มีผังร้าน</h2><p>เริ่มจากผังเปล่า หรือเลือกผังตัวอย่างคาเฟ่ 8×6 ม. ในหน้าออกแบบ</p><button class="btn pri" onclick="createNew()"><i class="ti ti-plus" aria-hidden="true"></i>สร้างผังแรก</button></div>`;return;
  }
  if(state==='limit'){
    a.innerHTML=`<div class="alert warn" role="status"><i class="ti ti-alert-triangle" aria-hidden="true"></i><div>ผังเต็มโควตา ${LIMIT} ผังแล้ว ลบผังที่ไม่ใช้ก่อนจึงสร้างผังใหม่ได้</div></div>`;
  }
  c.innerHTML=`<ul class="grid" aria-label="รายการผัง">${data.map(p=>`
    <li class="card">
      <a class="open" href="#/playground/${p.id}" aria-label="เปิดผัง ${p.name} ขนาด ${fmt(p.w)} × ${fmt(p.h)} เมตร ${p.edited}">
        <div class="thumb">${planSvg(p)}</div>
        <div class="info">
          <span class="badge" aria-hidden="true"><i class="ti ti-building-store"></i></span>
          <div class="txt"><h2 title="${p.name}">${p.name}</h2><div class="meta">${fmt(p.w)} × ${fmt(p.h)} ม. · ${p.edited}</div></div>
        </div>
      </a>
      <button class="more" aria-label="ตัวเลือกของผัง ${p.name}" aria-haspopup="menu" aria-expanded="false" data-more="${p.id}"><i class="ti ti-dots" aria-hidden="true"></i></button>
      <div class="menu" role="menu" hidden data-menu="${p.id}">
        <button role="menuitem" data-open="${p.id}"><i class="ti ti-external-link" aria-hidden="true"></i>เปิดผัง</button>
        <button role="menuitem" class="danger" data-del="${p.id}"><i class="ti ti-trash" aria-hidden="true"></i>ลบผัง</button>
      </div>
    </li>`).join('')}
    <li><button class="new-card" onclick="createNew()" ${state==='limit'?'aria-disabled="true"':''}><span class="plus"><i class="ti ti-plus" aria-hidden="true"></i></span>สร้างผังใหม่<small style="color:var(--sec);font-weight:400">${state==='limit'?`เต็มโควตา ${LIMIT} ผัง`:'เริ่มจากผังเปล่าหรือผังตัวอย่าง'}</small></button></li>
  </ul>`;
  c.querySelectorAll('[data-more]').forEach(b=>b.onclick=e=>{e.stopPropagation();toggleCardMenu(b)});
  c.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{closeCardMenus();toast('เปิดผัง… (/playground/'+b.dataset.open+')')});
  c.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{const m=c.querySelector(`[data-more="${b.dataset.del}"]`);closeCardMenus();askDelete(b.dataset.del,m)});
}
function closeCardMenus(){document.querySelectorAll('[data-menu]').forEach(m=>m.hidden=true);document.querySelectorAll('[data-more]').forEach(b=>b.setAttribute('aria-expanded','false'))}
function toggleCardMenu(b){
  const m=document.querySelector(`[data-menu="${b.dataset.more}"]`),open=m.hidden;closeCardMenus();
  if(open){m.hidden=false;b.setAttribute('aria-expanded','true');m.querySelector('button').focus()}
}
document.addEventListener('keydown',e=>{
  const m=e.target.closest&&e.target.closest('[data-menu]');if(!m)return;
  const items=[...m.querySelectorAll('button')],i=items.indexOf(e.target);
  if(e.key==='Escape'){const b=document.querySelector(`[data-more="${m.dataset.menu}"]`);closeCardMenus();b.focus()}
  if(e.key==='ArrowDown'){e.preventDefault();items[(i+1)%items.length].focus()}
  if(e.key==='ArrowUp'){e.preventDefault();items[(i-1+items.length)%items.length].focus()}
});
document.addEventListener('click',e=>{if(!e.target.closest('.card .menu,[data-more]'))closeCardMenus()});
function go(s){state=s;render();document.querySelectorAll('.mocknav [data-go]').forEach(b=>b.classList.toggle('on',b.dataset.go===s))}
function createNew(){
  if(state==='limit')return toast('ผังเต็มโควตา — ลบผังที่ไม่ใช้ก่อน');
  let n=data.length+1;while(data.some(p=>p.name==='ผังร้าน '+n))n++;
  lastNewFocus=document.activeElement;
  const i=$('#nm-input');i.value='ผังร้าน '+n;setNameError('');updateCount();$('#nm-w').value=8;$('#nm-dp').value=6;setSizeError('');setWall('bottom');
  $('#namer').hidden=false;i.focus();i.select();
}
let lastNewFocus;
const updateCount=()=>$('#nm-count').textContent=`${$('#nm-input').value.length}/80`;
function setNameError(m){
  $('#nm-input').setAttribute('aria-invalid',!!m);$('#nm-help').classList.toggle('err',!!m);
  $('#nm-msg').textContent=m||'เช่น ชื่อร้านหรือสาขา';
}
function closeNamer(){$('#namer').hidden=true;lastNewFocus&&lastNewFocus.focus()}
$('#nm-input').addEventListener('input',()=>{updateCount();setNameError('')});
$('#nm-cancel').onclick=closeNamer;
$('#namer').onclick=e=>{if(e.target.id==='namer')closeNamer()};
$('#namer').addEventListener('keydown',e=>{
  if(e.key==='Escape')closeNamer();
  if(e.key==='Tab'){const f=[...$('#namer').querySelectorAll('input,button')].filter(x=>x.tabIndex>=0);const i=f.indexOf(document.activeElement);
    if(e.shiftKey&&i===0){e.preventDefault();f.at(-1).focus()}else if(!e.shiftKey&&i===f.length-1){e.preventDefault();f[0].focus()}}
});
$('#nm-form').addEventListener('submit',e=>{
  e.preventDefault();const v=$('#nm-input').value.trim();
  if(!v){setNameError('ใส่ชื่อผังอย่างน้อย 1 ตัวอักษร');$('#nm-input').focus();return}
  const w=+$('#nm-w').value,dp=+$('#nm-dp').value,ok=x=>x>=2&&x<=30;
  if(!ok(w)||!ok(dp)){setSizeError('ขนาดร้านต้องอยู่ระหว่าง 2–30 เมตร',!ok(w),!ok(dp));(!ok(w)?$('#nm-w'):$('#nm-dp')).focus();return}
  const snap=x=>Math.round(x*4)/4;
  $('#namer').hidden=true;toast(`สร้าง “${v}” ${fmt(snap(w))} × ${fmt(snap(dp))} ม. ประตูด้าน${WALLS[wall]} → เปิดหน้าออกแบบ (ไม่ขึ้น onboarding ซ้ำ)`);
});
const WALLS={top:'บน',bottom:'ล่าง',left:'ซ้าย',right:'ขวา'};let wall='bottom';
const wallBtns=[...document.querySelectorAll('[data-wall]')];
function setWall(w,focus){wall=w;wallBtns.forEach(b=>{const on=b.dataset.wall===w;b.setAttribute('aria-checked',on);b.tabIndex=on?0:-1;if(on&&focus)b.focus()})}
wallBtns.forEach((b,i)=>{b.onclick=()=>setWall(b.dataset.wall);b.onkeydown=e=>{
  const d=e.key==='ArrowRight'||e.key==='ArrowDown'?1:e.key==='ArrowLeft'||e.key==='ArrowUp'?-1:0;
  if(d){e.preventDefault();setWall(wallBtns[(i+d+4)%4].dataset.wall,true)}}});
function setSizeError(m,badW=false,badD=false){
  const e=$('#size-err');e.hidden=!m;e.textContent=m;
  $('#nm-w').closest('.unit').classList.toggle('bad',badW);$('#nm-dp').closest('.unit').classList.toggle('bad',badD);
  $('#nm-w').setAttribute('aria-invalid',badW);$('#nm-dp').setAttribute('aria-invalid',badD);
}
['#nm-w','#nm-dp'].forEach(id=>$(id).addEventListener('input',()=>setSizeError('')));
$('#nm-tpl').onclick=()=>{const v=$('#nm-input').value.trim()||'คาเฟ่ 8×6 ม.';$('#namer').hidden=true;toast(`สร้าง “${v}” จากผังตัวอย่างคาเฟ่ 8×6 ม. → เปิดหน้าออกแบบ`)};
let lastFocus;
function askDelete(id,btn){
  pending=data.find(p=>p.id===id);lastFocus=btn;
  $('#cf-name').textContent=pending.name;$('#confirm').hidden=false;$('#cf-cancel').focus();
}
function closeDialog(){$('#confirm').hidden=true;pending=null;lastFocus&&lastFocus.isConnected&&lastFocus.focus()}
$('#cf-cancel').onclick=closeDialog;
$('#cf-ok').onclick=()=>{
  const name=pending.name;data=data.filter(p=>p!==pending);closeDialog();
  if(state==='limit')state='list';render();toast(`ลบ “${name}” แล้ว`);$('#new-top').focus();
};
$('#confirm').addEventListener('keydown',e=>{
  if(e.key==='Escape')closeDialog();
  if(e.key==='Tab'){const f=[$('#cf-cancel'),$('#cf-ok')];const i=f.indexOf(document.activeElement);if(e.shiftKey&&i===0){e.preventDefault();f[1].focus()}else if(!e.shiftKey&&i===1){e.preventDefault();f[0].focus()}}
});
$('#confirm').onclick=e=>{if(e.target.id==='confirm')closeDialog()};
let tt;function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,2600)}
$('#new-top').onclick=createNew;
const acct=$('#acct'),menu=$('#acct-menu');
acct.onclick=()=>{const o=menu.hidden;menu.hidden=!o;acct.setAttribute('aria-expanded',o)};
document.addEventListener('click',e=>{if(!e.target.closest('.menu-wrap')){menu.hidden=true;acct.setAttribute('aria-expanded','false')}});
document.querySelectorAll('.mocknav [data-go]').forEach(b=>b.onclick=()=>{
  if(b.dataset.go==='list'&&data.length===0)data=SAMPLES.slice();
  go(b.dataset.go)
});
render();
</script>
</body>
</html>
